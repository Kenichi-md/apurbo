<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUTTUS-AI Pair Code</title>
<style>
body{
margin:0;
background:#0d1117;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}
.box{
background:#161b22;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;
box-shadow:0 0 20px #00ff99;
}
input{
width:90%;
padding:12px;
margin:15px 0;
border:none;
border-radius:8px;
font-size:16px;
}
button{
padding:12px 25px;
border:none;
border-radius:8px;
background:#00ff99;
font-size:16px;
cursor:pointer;
font-weight:bold;
}
#result{
margin-top:20px;
font-size:18px;
color:#00ff99;
}
</style>
</head>
<body>

<div class="box">
<h2>PUTTUS-AI</h2>
<p>Enter WhatsApp Number</p>

<input type="text" id="number" placeholder="918967360566">

<button onclick="pair()">Generate Pair Code</button>

<div id="result"></div>
</div>

<script>
function pair(){
const num=document.getElementById("number").value;

if(!num){
document.getElementById("result").innerHTML="Enter a valid number";
return;
}

document.getElementById("result").innerHTML="Backend Required!";
}
</script>

</body>
</html>
